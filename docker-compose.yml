services:
  watchdog-main:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_FILE: /data/watchdog.json   # only imported once into PostgreSQL (set DATABASE_URL in .env)
      HOST: 0.0.0.0            # inside the container; published only on 127.0.0.1 below
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"   # aaPanel/nginx proxies to this port
    volumes:
      - watchdog-data:/data

volumes:
  watchdog-data:
