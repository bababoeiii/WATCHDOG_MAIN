<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐕%3C/text%3E%3C/svg%3E">
<title>Watchdog</title>
<style>
:root {
  color-scheme: light;
  --page: #f0efec; --card: #fcfcfb; --text: #0b0b0b; --muted: #6b6a66; --link: #2a78d6;
  --accent: #2a78d6; --accent-text: #fff; --line: rgba(127,127,127,.18); --soft: rgba(127,127,127,.10);
  --good: #0ca30c; --warning: #c98a00; --critical: #d03b3b; --info: #2a78d6;
  --track: rgba(127,127,127,.16); --danger-text: #d03b3b;
  --series-1: #2a78d6; --series-2: #eb6834; --threshold: rgba(208,59,59,.55);
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #111110; --card: #1a1a19; --text: #f0efec; --muted: #9a998f;
    --line: rgba(255,255,255,.10); --soft: rgba(255,255,255,.06); --link: #5c9ded; --accent: #3987e5; --warning: #e0a526;
    --track: rgba(255,255,255,.10); --series-1: #3987e5; --series-2: #d95926; --threshold: rgba(230,103,103,.6); }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: 14px 14px calc(28px + env(safe-area-inset-bottom)); max-width: 880px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 2px 12px; flex-wrap: wrap; }
.top h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.who { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.conn { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.conn.live i { background: var(--good); } .conn.down i { background: var(--critical); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tabs button.on { background: var(--card); color: var(--text); font-weight: 600; }

.card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
.card h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

input[type=text], input[type=password], input[type=email], input[type=number], select {
  background: var(--page); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.field { display: block; margin: 10px 0; }
label.field > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
label.field input, label.field select { width: 100%; }
.btn { border: 0; border-radius: 9px; padding: 9px 14px; cursor: pointer; background: var(--soft); }
.btn.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--critical); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.err { color: var(--critical); font-size: 13.5px; margin: 8px 0 0; min-height: 1em; }
.ok { color: var(--good); font-size: 13.5px; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
pre { background: var(--page); border-radius: 9px; padding: 10px; white-space: pre-wrap; word-break: break-all; margin: 6px 0; }
.copy { position: relative; }
.copy button { position: absolute; top: 6px; right: 6px; }

.login { max-width: 380px; margin: 8vh auto 0; }
.login .card { padding: 20px; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; margin: 16px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.qr { background: #fff; border-radius: 10px; padding: 8px; width: 200px; margin: 8px 0; }
.qr svg { display: block; width: 100%; height: auto; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.choice button { text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--page); cursor: pointer; }
.choice button.on { border-color: var(--accent); outline: 1px solid var(--accent); }
.choice button:disabled { opacity: .5; cursor: not-allowed; }

/* overview */
.problems { display: grid; gap: 6px; }
.problem { display: flex; gap: 8px; align-items: baseline; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; transform: translateY(-1px); }
.dot.online { background: var(--good); } .dot.offline { background: var(--critical); } .dot.pending { background: var(--muted); }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.badge.crit { color: var(--critical); } .badge.warn { color: var(--warning); } .badge.good { color: var(--good); }

/* events */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.events { list-style: none; margin: 0; padding: 0; }
.ev { display: grid; grid-template-columns: 26px 1fr; gap: 4px 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.ev:first-child { border-top: 0; }
.ev .icon { font-size: 16px; line-height: 1.3; text-align: center; }
.ev .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.ev .text { white-space: pre-wrap; word-break: break-word; }
.ev.new { animation: flash 1.6s ease; }
@keyframes flash { from { background: rgba(42,120,214,.14); } to { background: transparent; } }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; }
td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; margin: 4px 0; }
.checks label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.edit { background: var(--page); border-radius: 10px; padding: 10px 12px; margin: 4px 0 8px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--card);
  padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; }
/* servers (same look as the Telegram dashboard) */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.grid .card { margin: 0; }
.server { cursor: pointer; transition: transform .08s ease; }
.server:hover { outline: 1px solid var(--line); }
.server:active { transform: scale(.995); }
.sname { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--track); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; }
.pill.on i { background: var(--good); } .pill.off { color: var(--danger-text); } .pill.off i { background: var(--critical); } .pill.wait i { background: var(--muted); }
.meters { display: grid; gap: 7px; margin-top: 12px; }
.meter { display: grid; grid-template-columns: 42px 1fr 70px; align-items: center; gap: 10px; font-size: 13px; }
.meter .lbl { color: var(--muted); } .meter .val { text-align: right; }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar > b { display: block; height: 100%; border-radius: 3px; background: var(--good); transition: width .4s ease; }
.bar > b.warning { background: var(--warning); } .bar > b.critical { background: var(--critical); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 8px; background: rgba(208,59,59,.12); color: var(--danger-text); font-weight: 600; }
.back { border: 0; background: none; color: var(--link); padding: 4px 0; margin-bottom: 6px; cursor: pointer; font-weight: 500; }
.dhead { margin-bottom: 10px; } .dhead .sname { font-size: 20px; white-space: normal; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.tile { background: var(--card); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); } .tile .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; }
.tile .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.charts .card { margin: 0; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-head h3 { margin: 0 0 8px; } .chart-head .now { font-size: 13px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
canvas.chart { width: 100%; height: 130px; display: block; touch-action: pan-y; }
.cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; }
.core { height: 44px; border-radius: 6px; background: var(--track); position: relative; overflow: hidden; }
.core > b { position: absolute; left: 0; right: 0; bottom: 0; background: var(--series-1); border-radius: 4px 4px 0 0; transition: height .4s ease; }
.core > span { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 3px; font-size: 10.5px; font-weight: 600; }
td.r, th.r { text-align: right; } td .bar { margin-top: 4px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--text); color: var(--card); font-size: 12px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
@media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }
@media (max-width: 460px) { .tiles { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .hide-sm { display: none; } .choice { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<div id="tip" class="tip" hidden></div>
<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = (ts) => {
  if (!ts) return "—";
  const d = new Date(ts * 1000), now = new Date();
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return time;
  return d.toLocaleDateString([], { month: "short", day: "numeric", ...(d.getFullYear() !== now.getFullYear() ? { year: "numeric" } : {}) }) + " " + time;
};
const fmtAgo = (ts) => {
  if (!ts) return "never";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min ago`;
  return `${Math.floor(s / 86400)} d ago`;
};
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hidden"), 3200);
}
async function api(path, { method = "GET", body } = {}) {
  const res = await fetch("/api/web" + path, {
    method, credentials: "same-origin",
    headers: body !== undefined ? { "Content-Type": "application/json" } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch { /* empty */ }
  if (!res.ok) {
    if (res.status === 401 && S.me && !path.startsWith("/login")) { S.me = null; stopLive(); render(); }
    throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { status: res.status });
  }
  return data;
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); } catch { toast("Select the text and copy it by hand"); }
}
const copyBox = (text) => `<div class="copy"><pre>${esc(text)}</pre><button class="btn small" data-copy="${esc(text)}">Copy</button></div>`;
document.addEventListener("click", (e) => { const b = e.target.closest("[data-copy]"); if (b) copy(b.dataset.copy); });

const ICON = { down: "🔴", offline: "⏹", online: "🟢", connected: "🆕", reboot: "🔄", reboot_request: "🔁", alert: "⚠️",
  resolved: "✅", update: "⬆️", update_failed: "❗", main: "🐕", report: "🩺", audit: "👤" };

// ---------------------------------------------------------------- state
const S = {
  config: null, me: null, view: "events",
  servers: new Map(), kinds: {}, mutedUntil: null, retention: 30,
  thresholds: {}, historyMinutes: 60, detail: null, history: new Map(), hover: null,
  events: [], filter: { server: "", kind: "" }, more: true, loading: false,
  accounts: null, accountServers: [], telegramOwners: [], editing: null, created: null,
  added: null, conn: "",
  login: { step: "password", ticket: null, method: null, email: null, error: "" },
  invite: null, // { token, info, method, totp, emailSent, error }
};

// ---------------------------------------------------------------- live updates
let ws = null, wsRetry = 0, wsTimer = null;
function startLive() {
  stopLive();
  const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/web`;
  ws = new WebSocket(url);
  ws.onopen = () => { wsRetry = 0; setConn("live"); };
  ws.onmessage = (m) => {
    let msg; try { msg = JSON.parse(m.data); } catch { return; }
    if (msg.type === "event") onLiveEvent(msg.event);
    else if (msg.type === "server") {
      S.servers.set(msg.server.id, msg.server);
      const h = S.history.get(msg.server.id);
      if (h && msg.point) { // keep the charts going
        h.push(msg.point);
        const cut = Date.now() / 1000 - S.historyMinutes * 60;
        while (h.length && h[0][0] < cut) h.shift();
      }
      renderLater();
    }
    else if (msg.type === "removed") { S.servers.delete(msg.id); renderLater(); }
    else if (msg.type === "reload") loadOverview().then(() => reloadEvents());
  };
  ws.onclose = (e) => {
    ws = null;
    if (!S.me) return;
    if (e.code === 4401) { S.me = null; render(); return; }
    setConn("down");
    wsTimer = setTimeout(startLive, Math.min(30000, 1000 * 2 ** wsRetry++));
  };
}
function stopLive() { clearTimeout(wsTimer); if (ws) { ws.onclose = null; ws.close(); ws = null; } }
function setConn(c) { S.conn = c; const el = $("#conn"); if (el) { el.className = "conn " + c; el.lastChild.textContent = c === "live" ? "live" : "reconnecting…"; } }
setInterval(() => ws && ws.readyState === 1 && ws.send("ping"), 25000);

function matchesFilter(e) {
  if (S.filter.server && e.server !== S.filter.server) return false;
  if (S.filter.kind && e.kind !== S.filter.kind) return false;
  return S.view === "activity" ? e.kind === "audit" : e.kind !== "audit"; // activity has its own tab
}
function onLiveEvent(e) {
  if (S.events.some((x) => x.id === e.id)) return;
  if ((S.view === "events" || S.view === "activity") && matchesFilter(e)) {
    e._new = true;
    S.events.unshift(e);
    renderLater();
  }
}

// ---------------------------------------------------------------- data
async function loadOverview() {
  const o = await api("/overview");
  S.me = o.me;
  S.servers = new Map(o.servers.map((s) => [s.id, s]));
  S.kinds = o.kinds; S.mutedUntil = o.muted_until; S.retention = o.retention_days;
  S.thresholds = o.thresholds || {}; S.historyMinutes = o.history_minutes || 60;
}
async function reloadEvents() {
  S.events = []; S.more = true;
  await loadMore();
}
async function loadMore() {
  if (S.loading || !S.more) return;
  S.loading = true; render();
  try {
    const q = new URLSearchParams({ limit: "100" });
    const kind = S.view === "activity" ? "audit" : S.filter.kind;
    if (kind) q.set("kind", kind);
    else q.set("exclude", "audit");
    if (S.filter.server) q.set("server", S.filter.server);
    const last = S.events[S.events.length - 1];
    if (last) q.set("before", String(last.id));
    const { events } = await api("/events?" + q);
    S.events.push(...events.filter((e) => !S.events.some((x) => x.id === e.id)));
    S.more = events.length === 100;
  } catch (e) { toast(e.message); }
  S.loading = false; render();
}
async function loadAccounts() {
  const r = await api("/accounts");
  S.accounts = r.accounts; S.accountServers = r.servers; S.telegramOwners = r.telegram_owners;
}

// ---------------------------------------------------------------- views: login
function renderLogin() {
  const L = S.login, c = S.config || {};
  let body;
  if (L.step === "password") {
    body = `<form id="f-login">
      <label class="field"><span>Username</span><input type="text" name="username" autocomplete="username" autocapitalize="none" value="${esc(L.username || "")}" required ${L.username ? "" : "autofocus"}></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required ${L.username ? "autofocus" : ""}></label>
      <button class="btn primary" style="width:100%">Continue</button>
      <p class="err">${esc(L.error)}</p></form>`;
  } else {
    body = `<form id="f-code">
      <p class="small muted">${L.method === "totp" ? "Enter the 6-digit code from your authenticator app." : `We sent a 6-digit code to <b>${esc(L.email)}</b>.`}</p>
      <label class="field"><span>Code</span><input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="8" required autofocus></label>
      <button class="btn primary" style="width:100%">Log in</button>
      <p class="err">${esc(L.error)}</p>
      <p class="small"><a href="#" id="restart">← Start again</a></p></form>`;
  }
  return `<div class="login"><div class="top"><h1>🐕 Watchdog</h1></div><div class="card">
    <h2>Log in</h2>${body}
    ${L.step === "password" && c.bot_username ? `<div class="divider">or</div><div id="tg-login" style="text-align:center"></div>` : ""}
    ${L.step === "password" ? `<p class="small muted" style="margin:14px 0 0">Owner? Send <code>/login</code> to the bot for a one-time login link.</p>` : ""}
  </div></div>`;
}
function bindLogin() {
  const f = $("#f-login");
  if (f) f.onsubmit = async (e) => {
    e.preventDefault();
    const d = new FormData(f);
    S.login.error = "";
    S.login.username = d.get("username"); // kept when the password was wrong
    try {
      const r = await api("/login", { method: "POST", body: { username: d.get("username"), password: d.get("password") } });
      Object.assign(S.login, { step: "code", ticket: r.ticket, method: r.method, email: r.email });
    } catch (err) { S.login.error = err.message; }
    render();
  };
  const fc = $("#f-code");
  if (fc) fc.onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api("/login/verify", { method: "POST", body: { ticket: S.login.ticket, code: new FormData(fc).get("code") } });
      S.login = { step: "password", error: "", username: S.login.username };
      await enter();
    } catch (err) {
      S.login.error = err.message;
      if (/Start again|took too long/.test(err.message)) S.login.step = "password";
      render();
    }
  };
  const r = $("#restart");
  if (r) r.onclick = (e) => { e.preventDefault(); S.login = { step: "password", error: "", username: S.login.username }; render(); };
  const tg = $("#tg-login");
  if (tg && S.config?.bot_username) {
    const sc = document.createElement("script");
    sc.async = true;
    sc.src = "https://telegram.org/js/telegram-widget.js?22";
    sc.dataset.telegramLogin = S.config.bot_username;
    sc.dataset.size = "large";
    sc.dataset.radius = "9";
    sc.dataset.onauth = "onTelegramAuth(user)";
    tg.appendChild(sc);
  }
}
window.onTelegramAuth = async (user) => {
  try {
    await api("/login/telegram", { method: "POST", body: user });
    await enter();
  } catch (e) { S.login.error = e.message; render(); }
};

// ---------------------------------------------------------------- views: invite (set password + second step)
function renderInvite() {
  const I = S.invite;
  if (I.error && !I.info) return `<div class="login"><div class="top"><h1>🐕 Watchdog</h1></div><div class="card"><h2>Invite</h2><p class="err">${esc(I.error)}</p><p><a href="/">Go to login</a></p></div></div>`;
  if (!I.info) return `<div class="login"><div class="card muted">Loading…</div></div>`;
  const c = I.info;
  const m = I.method;
  let second = "";

      <label class="field"><span>Repeat the password</span><input type="password" name="password2" autocomplete="new-password" value="${esc(I.password2 || "")}" required></label>
      <h3>Second step at every login</h3>
      <div class="choice">
        <button type="button" data-method="totp" class="${m === "totp" ? "on" : ""}"><b>Authenticator app</b><br><span class="small muted">6-digit codes on your phone</span></button>
        <button type="button" data-method="email" class="${m === "email" ? "on" : ""}" ${c.email_codes ? "" : "disabled"}><b>E-mail code</b><br><span class="small muted">${c.email_codes ? "a code by e-mail each time" : "not set up on this server"}</span></button>

function bindInvite() {
  const f = $("#f-invite");
  if (!f) return;
  const keep = () => { S.invite.password = f.password.value; S.invite.password2 = f.password2.value; if (f.email) S.invite.email = f.email.value; };
  f.querySelectorAll("[data-method]").forEach((b) => (b.onclick = async () => {
    keep();
    S.invite.method = b.dataset.method; S.invite.error = "";
    if (S.invite.method === "totp" && !S.invite.totp) {
      try { S.invite.totp = await api(`/invite/${S.invite.token}/totp`, { method: "POST", body: {} }); } catch (e) { S.invite.error = e.message; }
    }
    render();
  }));
  const send = $("#send-code");
  if (send) send.onclick = async () => {
    keep();
    try { await api(`/invite/${S.invite.token}/email`, { method: "POST", body: { email: f.email.value } }); S.invite.emailSent = true; S.invite.error = ""; toast("Code sent"); }
    catch (e) { S.invite.error = e.message; }
    render();
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    keep();
    if (f.password.value !== f.password2.value) { S.invite.error = "The two passwords are not the same"; return render(); }
    try {
      await api(`/invite/${S.invite.token}/finish`, { method: "POST", body: { password: f.password.value, method: S.invite.method, code: f.code?.value || "" } });
      S.invite = null;
      history.replaceState(null, "", "/");
      await enter();
    } catch (err) { S.invite.error = err.message; render(); }
  };
}

// ---------------------------------------------------------------- views: the app
function renderApp() {
  const me = S.me;
  const tabs = [["events", "Notifications"], ["servers", "Servers"]];
  if (me.is_owner) tabs.push(["accounts", "Accounts"], ["activity", "Activity"]);
  let main = "";
  if (S.view === "events" || S.view === "activity") main = renderEvents();
  else if (S.view === "servers") main = renderServers();
  else if (S.view === "accounts") main = renderAccounts();
  return `<div class="top"><h1>🐕 Watchdog</h1>
      <div class="who"><span id="conn" class="conn ${S.conn}"><i></i>${S.conn === "live" ? "live" : S.conn === "down" ? "reconnecting…" : "connecting…"}</span>
      <span><b>${esc(me.name)}</b> <span class="badge">${esc(me.role_label)}</span></span><button class="btn small" id="logout">Log out</button></div></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button data-view="${k}" class="${S.view === k ? "on" : ""}">${l}</button>`).join("")}</div>
    ${main}`;

const serverList = () => [...S.servers.values()].sort((a, b) => a.name.localeCompare(b.name));
function renderOverview() {
  const list = serverList();
  const offline = list.filter((s) => s.status === "offline");
  const alerts = list.flatMap((s) => (s.status === "online" ? s.alerts.map((a) => [s, a]) : []));
  const online = list.filter((s) => s.status === "online").length;
  const reason = { timeout: "no reports", shutdown: "shut down", agent_stopped: "agent stopped" };
  let html = `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Now</h2>
    <span class="small muted">${online}/${list.length} online${S.mutedUntil ? ` · 🔕 Telegram muted until ${fmtTime(S.mutedUntil)}` : ""}</span></div>`;
  if (!list.length) html += `<p class="muted small">No servers ${S.me.is_owner ? "yet" : "assigned to you yet — ask an owner"}.</p>`;
  else if (!offline.length && !alerts.length) html += `<p class="ok" style="margin:10px 0 0">✅ All clear — nothing down, no active alerts.</p>`;
  else {
    html += `<div class="problems" style="margin-top:10px">`;
    for (const s of offline) html += `<div class="problem"><span class="dot offline"></span><div><b>${esc(s.name)}</b> offline since ${fmtTime(s.status_since)} <span class="muted small">(${esc(reason[s.offline_reason] || "offline")}, ${fmtAgo(s.status_since)})</span></div></div>`;
    for (const [s, a] of alerts) html += `<div class="problem"><span>⚠️</span><div><b>${esc(s.name)}</b>: ${esc(a.label)}${a.detail ? ` on ${esc(a.detail)}` : ""} — ${Math.round(a.value)}${esc(a.unit)} <span class="muted small">for ${fmtAgo(a.since).replace(" ago", "")}</span></div></div>`;
    html += `</div>`;
  }
  return html + `</div>`;
}

function renderEvents() {
  const activity = S.view === "activity";
  const kinds = Object.entries(S.kinds).filter(([k]) => k !== "audit");
  let html = activity ? `<div class="card small muted">Who did what on this website (logins set up, servers added, reboots, account changes). Owners only.</div>` : renderOverview();
  html += `<div class="card">${activity ? "" : `<div class="filters">
      <select id="f-server"><option value="">All servers</option>${serverList().map((s) => `<option value="${esc(s.id)}" ${S.filter.server === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
      <select id="f-kind"><option value="">All types</option>${kinds.map(([k, l]) => `<option value="${k}" ${S.filter.kind === k ? "selected" : ""}>${ICON[k] || ""} ${esc(l)}</option>`).join("")}</select>
    </div>`}
    <ul class="events">`;
  for (const e of S.events) {
    html += `<li class="ev${e._new ? " new" : ""}"><div class="icon">${ICON[e.kind] || "•"}</div><div>
      <div class="meta"><span class="num" title="${esc(new Date(e.ts * 1000).toLocaleString())}">${fmtTime(e.ts)}</span>
        ${e.name ? `<b>${esc(e.name)}</b>` : `<span>Main server</span>`}
        <span>${esc(S.kinds[e.kind] || e.kind)}</span>
        ${e.actor ? `<span>by ${esc(e.actor)}</span>` : ""}
        ${e.muted ? `<span class="badge" title="Notifications were muted: this wasn't sent to Telegram">🔕 muted</span>` : ""}
        ${e.important && !activity ? `<span class="badge crit">important</span>` : ""}</div>
      <div class="text">${esc(e.text.replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u, ""))}</div></div></li>`;
    delete e._new;
  }
  html += `</ul>`;
  if (!S.events.length && !S.loading) html += `<p class="muted small">Nothing here${S.filter.server || S.filter.kind ? " with these filters" : " yet"}. History is kept for ${S.retention} days.</p>`;
  if (S.more && S.events.length) html += `<div style="text-align:center;margin-top:8px"><button class="btn" id="more" ${S.loading ? "disabled" : ""}>${S.loading ? "Loading…" : "Load older"}</button></div>`;
  else if (S.events.length) html += `<p class="muted small" style="text-align:center">That's everything from the last ${S.retention} days.</p>`;
  return html + `</div>`;
}

// ---------------------------------------------------------------- servers (like the Telegram dashboard)
const pct = (v) => (v == null ? "—" : `${Math.round(v)}%`);
function fmtBytes(n) {
  if (n == null) return "—";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (Math.abs(n) >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return i === 0 ? `${Math.round(n)} B` : `${n.toFixed(n >= 100 ? 0 : 1)} ${u[i]}`;
}
const fmtRate = (n) => (n == null ? "—" : `${fmtBytes(n)}/s`);
function fmtDur(sec) {
  if (sec == null) return "—";
  sec = Math.max(0, Math.floor(sec));
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (d) return `${d}d ${h}h`; if (h) return `${h}h ${m}m`; if (m) return `${m}m`; return `${s}s`;
}
const fmtClock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const nowS = () => Date.now() / 1000;
function level(v, key) {
  const t = S.thresholds[key];
  if (v == null || !t) return "";
  if (v >= t) return "critical";
  if (v >= t - 15) return "warning";
  return "";
}
function worstDisk(m) {
  const d = (m && m.disks) || [];
  return d.length ? d.reduce((a, b) => (b.percent > a.percent ? b : a)) : null;
}
function meter(label, value, key, right) {
  return `<div class="meter"><span class="lbl">${label}</span>
    <div class="bar"><b class="${level(value, key)}" style="width:${Math.min(100, Math.max(0, value || 0))}%"></b></div>
    <span class="val num">${right ?? pct(value)}</span></div>`;
}
function statusPill(s) {
  if (s.status === "pending") return `<span class="pill wait"><i></i>Waiting</span>`;
  if (s.status === "online") return `<span class="pill on"><i></i>Online</span>`;
  const why = s.offline_reason === "shutdown" ? "Shut down" : s.offline_reason === "agent_stopped" ? "Agent stopped" : "Offline";
  return `<span class="pill off"><i></i>${why} · ${fmtDur(nowS() - (s.status_since || nowS()))}</span>`;
}
function serverCard(s) {
  const m = s.metrics || {};
  const head = `<div class="sh"><span class="sname">${esc(s.name)}</span>${statusPill(s)}</div>`;
  if (s.status === "pending") return `<div class="card server" data-server="${esc(s.id)}">${head}<div class="facts"><span>Waiting for its first report</span></div></div>`;
  if (s.status !== "online") {
    return `<div class="card server" data-server="${esc(s.id)}">${head}<div class="facts"><span>Last seen ${s.last_seen ? fmtTime(s.last_seen) : "never"}</span>${m.os ? `<span>${esc(m.os)}</span>` : ""}</div></div>`;
  }
  const disk = worstDisk(m), temp = m.temp && m.temp.max, net = m.net || {};
  const chips = (s.alerts || []).map((a) => `<span class="chip">⚠ ${esc(a.label)}</span>`).join("") + (s.reboot_pending ? `<span class="chip">⏳ rebooting</span>` : "");
  return `<div class="card server" data-server="${esc(s.id)}">${head}
    <div class="meters">
      ${meter("CPU", m.cpu && m.cpu.percent, "cpu")}
      ${meter("RAM", m.mem && m.mem.percent, "ram")}
      ${disk ? meter("Disk", disk.percent, "disk") : ""}
      ${temp != null ? meter("Temp", Math.min(100, temp), "temp", `${Math.round(temp)}°C`) : ""}
    </div>
    <div class="facts num"><span>Up ${fmtDur(m.uptime)}</span><span>↓ ${fmtRate(net.rx_rate)}</span><span>↑ ${fmtRate(net.tx_rate)}</span>
      ${m.cpu && m.cpu.load ? `<span>Load ${m.cpu.load[0].toFixed(2)}</span>` : ""}</div>
    ${chips ? `<div class="chips">${chips}</div>` : ""}</div>`;
}

  if (S.detail) return renderServerDetail();
  const me = S.me;
  let html = "";
  if (me.can_operate) {
    html += `<div class="card"><h2>Add a server</h2>
      <form id="f-add" class="row"><input class="grow" type="text" name="name" placeholder="Name, e.g. web-1" maxlength="40" required><button class="btn primary">Add</button></form>
      ${S.added ? `<div style="margin-top:12px"><p class="ok">✅ <b>${esc(S.added.server.name)}</b> added${me.is_owner ? "" : " and assigned to you"}. The token is shown only now.</p>
        ${S.added.install ? `<h3>Install on the server (Linux, as root)</h3>${copyBox(S.added.install)}` : ""}
        <h3>Or put this in its .env</h3>${copyBox(S.added.env)}
        <p class="small muted">To allow remote reboots from here, also add <code>ALLOW_REMOTE_REBOOT=true</code> to its .env.</p>
        <button class="btn small" id="added-done">Done</button></div>` : ""}</div>`;
  }

function tile(k, v, s) { return `<div class="tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="s">${s || "&nbsp;"}</div></div>`; }
function chartCard(id, title, now, legend) {
  return `<div class="card"><div class="chart-head"><h3>${title}</h3>${legend ? `<div class="legend">${legend}</div>` : `<span class="now num">${now}</span>`}</div>
    <canvas class="chart" id="${id}"></canvas></div>`;
}
function renderServerDetail() {
  const s = S.servers.get(S.detail);

  const online = s.status === "online";
  let reboot = "";
  if (S.me.can_operate) {
    const why = s.reboot_pending ? "" : !online ? "Offline: it can't receive a reboot" : !s.allow_reboot ? "Not allowed: set ALLOW_REMOTE_REBOOT=true in its .env" : "";
    reboot = `<button class="btn small" data-reboot="${esc(s.id)}" ${why || s.reboot_pending ? "disabled" : ""} title="${esc(why)}">${s.reboot_pending ? "⏳ Rebooting…" : "🔁 Reboot"}</button>
      ${why ? `<span class="small muted">${esc(why)}</span>` : ""}`;
  }

    <div class="dhead"><div class="sh"><span class="sname">${esc(s.name)}</span>${statusPill(s)}</div>

    ${reboot ? `<div class="row" style="margin-top:10px">${reboot}</div>` : ""}</div>`;

  }
  html += `<div class="tiles">
    ${tile("CPU", pct(cpu.percent), cpu.count ? `${cpu.count} cores${cpu.freq_mhz ? " · " + (cpu.freq_mhz / 1000).toFixed(1) + " GHz" : ""}` : "")}
    ${tile("RAM", pct(mem.percent), mem.total ? `${fmtBytes(mem.used)} of ${fmtBytes(mem.total)}` : "")}
    ${tile("Temp", temp ? `${Math.round(temp.max)}°C` : "—", temp ? esc(temp.max_label) : "no sensors")}
    ${tile("Load", cpu.load ? cpu.load[0].toFixed(2) : "—", cpu.load ? `${cpu.load[1].toFixed(2)} · ${cpu.load[2].toFixed(2)}` : "")}</div>`;
  html += `<div class="charts">${chartCard("c-cpu", "CPU %", pct(cpu.percent))}${chartCard("c-ram", "RAM %", pct(mem.percent))}
    ${temp ? chartCard("c-temp", "Temperature °C", `${Math.round(temp.max)}°C`) : ""}
    ${chartCard("c-net", "Network", "", `<span><i style="background:var(--series-1)"></i>↓ ${fmtRate(net.rx_rate)}</span><span><i style="background:var(--series-2)"></i>↑ ${fmtRate(net.tx_rate)}</span>`)}</div><div style="height:10px"></div>`;
  if (cpu.per_core && cpu.per_core.length > 1) {
    html += `<div class="card"><h3>Cores</h3><div class="cores">${cpu.per_core.map((v, i) => `<div class="core" title="Core ${i}: ${Math.round(v)}%"><b style="height:${v}%"></b><span class="num">${Math.round(v)}</span></div>`).join("")}</div></div>`;
  }
  if ((m.disks || []).length) {
    html += `<div class="card"><h3>Disks</h3><table><tr><th>Mount</th><th class="r">Used</th><th class="r">Size</th></tr>
      ${m.disks.map((d) => `<tr><td>${esc(d.mount)}<div class="bar"><b class="${level(d.percent, "disk")}" style="width:${d.percent}%"></b></div></td><td class="r num">${pct(d.percent)}</td><td class="r num">${fmtBytes(d.total)}</td></tr>`).join("")}</table>
      ${m.diskio ? `<div class="facts num"><span>Read ${fmtRate(m.diskio.read_rate)}</span><span>Write ${fmtRate(m.diskio.write_rate)}</span>${m.swap && m.swap.total ? `<span>Swap ${pct(m.swap.percent)} of ${fmtBytes(m.swap.total)}</span>` : ""}</div>` : ""}</div>`;
  }
  const procs = m.procs;
  if (procs && procs.top_cpu) {

  }
  if (temp && temp.sensors && temp.sensors.length > 1) {
    html += `<div class="card"><h3>Sensors</h3><table>${temp.sensors.map((t) => `<tr><td>${esc(t.chip)} <span class="muted">${esc(t.label)}</span></td><td class="r num">${t.current.toFixed(0)}°C</td></tr>`).join("")}</table></div>`;
  }
  return html;
}

async function openServer(id) {

// charts (same drawing as the Telegram dashboard)
function drawCharts() {
  if (S.view !== "servers" || !S.detail) return;
  const s = S.servers.get(S.detail); if (!s) return;
  const h = S.history.get(S.detail) || [];
  const th = S.thresholds;
  const tEnd = nowS(), tStart = tEnd - S.historyMinutes * 60;
  const c1 = cssVar("--series-1"), c2 = cssVar("--series-2");
  const o = { tStart, tEnd, gap: Math.max(20, ((s.metrics && s.metrics.interval) || 5) * 4) };
  lineChart("c-cpu", h, [{ i: 1, color: c1, name: "CPU", fmt: pct }], { ...o, min: 0, max: 100, threshold: th.cpu });
  lineChart("c-ram", h, [{ i: 2, color: c1, name: "RAM", fmt: pct }], { ...o, min: 0, max: 100, threshold: th.ram });
  lineChart("c-temp", h, [{ i: 3, color: c1, name: "Temp", fmt: (v) => `${Math.round(v)}°C` }], { ...o, min: 20, threshold: th.temp });
  lineChart("c-net", h, [{ i: 4, color: c1, name: "↓ In", fmt: fmtRate }, { i: 5, color: c2, name: "↑ Out", fmt: fmtRate }], { ...o, min: 0, axisFmt: fmtBytes });
}
function lineChart(id, hist, series, o) {
  const cv = document.getElementById(id); if (!cv) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const pad = { l: 4, r: 44, t: 8, b: 18 }, pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  let lo = o.min ?? Infinity, hi = o.max ?? -Infinity;
  if (o.max == null || o.min == null) {
    for (const p of hist) for (const s of series) { const v = p[s.i]; if (v != null) { if (o.min == null) lo = Math.min(lo, v); if (o.max == null) hi = Math.max(hi, v); } }
    if (o.threshold && o.max == null) hi = Math.max(hi, o.threshold + 5);
    if (!isFinite(hi)) hi = 1; if (!isFinite(lo)) lo = 0;
    if (o.max == null) hi = hi <= 0 ? 1 : hi * 1.15;
    if (hi - lo < 1) hi = lo + 1;
  }
  const x = (t) => pad.l + ((t - o.tStart) / (o.tEnd - o.tStart)) * pw;
  const y = (v) => pad.t + ph - ((v - lo) / (hi - lo)) * ph;
  const muted = cssVar("--muted"), grid = cssVar("--line");
  ctx.font = "10.5px -apple-system, system-ui, sans-serif"; ctx.textBaseline = "middle"; ctx.lineWidth = 1;
  for (let k = 0; k <= 2; k++) {
    const v = lo + (hi - lo) * (k / 2), yy = Math.round(y(v)) + .5;
    ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(pad.l + pw, yy); ctx.stroke();
    ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.fillText(o.axisFmt ? o.axisFmt(v) : Math.round(v), pad.l + pw + 6, yy);
  }
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = muted;
  ctx.fillText(`-${Math.round((o.tEnd - o.tStart) / 60)}m`, pad.l, H - 3);
  ctx.textAlign = "right"; ctx.fillText("now", pad.l + pw, H - 3);
  if (o.threshold && o.threshold > lo && o.threshold < hi) {
    const ty = Math.round(y(o.threshold)) + .5;
    ctx.strokeStyle = cssVar("--threshold"); ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(pad.l, ty); ctx.lineTo(pad.l + pw, ty); ctx.stroke(); ctx.setLineDash([]);
  }
  if (!hist.length) { ctx.fillStyle = muted; ctx.textAlign = "center"; ctx.fillText("collecting data…", pad.l + pw / 2, pad.t + ph / 2); cv._chart = null; return; }
  for (const s of series) {
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath(); let prev = null;
    for (const p of hist) {
      const v = p[s.i]; if (v == null || p[0] < o.tStart) { prev = null; continue; }
      const px = x(p[0]), py = y(Math.min(hi, Math.max(lo, v)));
      if (prev && p[0] - prev <= o.gap) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      prev = p[0];
    }
    ctx.stroke();
  }
  cv._chart = { hist, series, x, y, lo, hi, pad, pw, ph, o };
  if (S.hover && S.hover.id === id) drawHover(cv, ctx, S.hover.idx);
}
function drawHover(cv, ctx, idx) {
  const c = cv._chart; if (!c) return;
  const p = c.hist[idx]; if (!p) return;
  const px = c.x(p[0]);
  ctx.strokeStyle = cssVar("--muted"); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(Math.round(px) + .5, c.pad.t); ctx.lineTo(Math.round(px) + .5, c.pad.t + c.ph); ctx.stroke();
  for (const s of c.series) {
    const v = p[s.i]; if (v == null) continue;
    const py = c.y(Math.min(c.hi, Math.max(c.lo, v)));
    ctx.fillStyle = cssVar("--card"); ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
  }
}
function onPointer(ev) {
  const cv = ev.target.closest && ev.target.closest("canvas.chart");
  const tip = $("#tip");
  if (!cv || !cv._chart) { if (S.hover) { S.hover = null; tip.hidden = true; drawCharts(); } return; }
  const c = cv._chart, r = cv.getBoundingClientRect();
  const t = c.o.tStart + ((ev.clientX - r.left - c.pad.l) / c.pw) * (c.o.tEnd - c.o.tStart);
  let idx = -1, bd = Infinity;
  for (let i = 0; i < c.hist.length; i++) { const d = Math.abs(c.hist[i][0] - t); if (d < bd) { bd = d; idx = i; } }
  if (idx < 0) return;
  S.hover = { id: cv.id, idx };
  drawCharts();
  const p = c.hist[idx];
  tip.innerHTML = `<span class="num">${fmtClock(p[0])}</span>` + c.series.map((s) => `<br><span style="color:${s.color}">■</span> ${s.name} <b class="num">${p[s.i] == null ? "—" : s.fmt(p[s.i])}</b>`).join("");
  tip.hidden = false;
  const tw = tip.offsetWidth;
  let left = ev.clientX + 12; if (left + tw > window.innerWidth - 8) left = ev.clientX - tw - 12;
  tip.style.left = `${Math.max(8, left)}px`; tip.style.top = `${r.top + 4}px`;
}
document.addEventListener("pointermove", onPointer);
document.addEventListener("pointerdown", onPointer);
window.addEventListener("resize", () => drawCharts());

const ROLE = { owner: "Owner", staff: "Staff", user: "User" };
const ROLE_HELP = { owner: "every server, accounts, activity", staff: "assigned servers; add + reboot", user: "assigned servers, read only" };
function serverChecks(name, selected) {
  if (!S.accountServers.length) return `<p class="small muted">No servers yet.</p>`;
  return `<div class="checks">${S.accountServers.map((s) => `<label><input type="checkbox" name="${name}" value="${esc(s.id)}" ${selected.includes(s.id) ? "checked" : ""}> ${esc(s.name)}</label>`).join("")}</div>`;
}
function renderAccounts() {
  if (!S.accounts) return `<div class="card muted">Loading…</div>`;
  const nameOf = new Map(S.accountServers.map((s) => [s.id, s.name]));
  let html = `<div class="card"><h2>New account</h2>
    <form id="f-new">
      <div class="row"><label class="field grow"><span>Username</span><input type="text" name="username" autocapitalize="none" maxlength="32" required></label>
      <label class="field"><span>Role</span><select name="role">${["user", "staff", "owner"].map((r) => `<option value="${r}">${ROLE[r]} — ${ROLE_HELP[r]}</option>`).join("")}</select></label></div>
      <span class="small muted">Servers it can see (owners see all)</span>${serverChecks("servers", [])}
      <div class="row"><label class="field grow"><span>E-mail (optional, for e-mail codes)</span><input type="email" name="email"></label>
      <label class="field grow"><span>Telegram ID (optional, allows "Log in with Telegram")</span><input type="text" name="telegram_id" inputmode="numeric"></label></div>
      <button class="btn primary">Create and get invite link</button></form>
    ${S.created ? `<div style="margin-top:12px"><p class="ok">✅ Send this link to <b>${esc(S.created.username)}</b>. It works once, for 48 hours; they set their password and second step there.</p>${copyBox(S.created.url)}<button class="btn small" id="created-done">Done</button></div>` : ""}
  </div>`;
  html += `<div class="card"><h2>Accounts</h2>
    <p class="small muted">Telegram owners (ADMIN_IDS in .env, always owners): ${S.telegramOwners.map((id) => `<code>${id}</code>`).join(", ") || "none"}</p>`;
  if (!S.accounts.length) html += `<p class="muted small">No accounts yet.</p>`;
  else {
    html += `<table><tr><th>Account</th><th class="hide-sm">Servers</th><th class="hide-sm">Login</th><th></th></tr>`;
    for (const a of S.accounts) {
      const servers = a.role === "owner" ? "all" : a.servers.map((id) => nameOf.get(id)).filter(Boolean).join(", ") || "none";
      const login = a.invited ? `<span class="badge warn">invite open</span>` : a.disabled ? `<span class="badge crit">disabled</span>` : `${a.twofa === "totp" ? "app" : "e-mail"}${a.telegram_id ? " · Telegram" : ""}<div class="small muted">last ${fmtAgo(a.last_login)}</div>`;
      html += `<tr><td><b>${esc(a.username)}</b> <span class="badge">${ROLE[a.role]}</span>${a.id === S.me.self_id ? ` <span class="small muted">(you)</span>` : ""}</td>
        <td class="hide-sm small">${esc(servers)}</td><td class="hide-sm small">${login}</td>
        <td style="text-align:right"><button class="btn small" data-edit="${esc(a.id)}">${S.editing === a.id ? "Close" : "Edit"}</button></td></tr>`;
      if (S.editing === a.id) html += `<tr><td colspan="4">${renderEdit(a)}</td></tr>`;
    }
    html += `</table>`;
  }
  return html + `</div>`;
}
function renderEdit(a) {
  const self = a.id === S.me.self_id;
  return `<form class="edit" id="f-edit" data-id="${esc(a.id)}">
    <div class="row"><label class="field"><span>Role</span><select name="role" ${self ? "disabled" : ""}>${["user", "staff", "owner"].map((r) => `<option value="${r}" ${a.role === r ? "selected" : ""}>${ROLE[r]}</option>`).join("")}</select></label>
      <label class="field grow"><span>E-mail</span><input type="email" name="email" value="${esc(a.email || "")}"></label>
      <label class="field grow"><span>Telegram ID</span><input type="text" name="telegram_id" inputmode="numeric" value="${esc(a.telegram_id ?? "")}"></label></div>
    <span class="small muted">Servers</span>${serverChecks("servers", a.servers)}
    <div class="row" style="margin-top:8px"><button class="btn primary">Save</button>
      ${self ? `<span class="small muted">You can't change your own role, disable, reset or delete yourself.</span>` : `
      <button type="button" class="btn" data-act="toggle">${a.disabled ? "Enable" : "Disable"}</button>
      <button type="button" class="btn" data-act="reset" title="New invite link: new password and second step">Reset login</button>
      <button type="button" class="btn danger" data-act="delete">Delete</button>`}</div>
  </form>`;
}

// ---------------------------------------------------------------- render + events
let renderPending = false;
function renderLater() { if (!renderPending) { renderPending = true; requestAnimationFrame(() => { renderPending = false; render(); }); } }
function render() {
  const root = $("#root");
  // keep what the user is typing in forms that a live update re-renders
  const active = document.activeElement;
  const keep = active && active.form && active.form.id && active.name ? { form: active.form.id, name: active.name, value: active.value, start: active.selectionStart } : null;
  const formVals = {};
  for (const f of root.querySelectorAll("form[id]")) formVals[f.id] = [...f.elements].filter((el) => el.name && el.type !== "checkbox").map((el) => [el.name, el.value]);
  const checks = {};
  for (const f of root.querySelectorAll("form[id]")) checks[f.id] = [...f.querySelectorAll("input[type=checkbox]")].map((el) => [el.name, el.value, el.checked]);

  if (S.invite) root.innerHTML = renderInvite();
  else if (!S.me) root.innerHTML = renderLogin();
  else root.innerHTML = renderApp();

  for (const [id, vals] of Object.entries(formVals)) {
    const f = document.getElementById(id);
    if (!f || id === "f-login" || id === "f-code" || id === "f-invite") continue;
    for (const [n, v] of vals) if (f.elements[n] && f.elements[n].value !== undefined && f.elements[n].type !== "submit") f.elements[n].value = v;
    for (const [n, v, c] of checks[id] || []) { const el = f.querySelector(`input[type=checkbox][name="${n}"][value="${CSS.escape(v)}"]`); if (el) el.checked = c; }
  }
  if (keep) {
    const f = document.getElementById(keep.form);
    const el = f && f.elements[keep.name];
    if (el && el.focus) { el.focus(); try { el.setSelectionRange(keep.start, keep.start); } catch { /* not a text input */ } }
  }
  if (S.invite) bindInvite();
  else if (!S.me) bindLogin();
  else { bindApp(); drawCharts(); }
}

function bindApp() {
  $("#logout").onclick = async () => { await api("/logout", { method: "POST", body: {} }).catch(() => {}); S.me = null; stopLive(); render(); };
  document.querySelectorAll("[data-view]").forEach((b) => (b.onclick = async () => {
    S.view = b.dataset.view;
    S.detail = null;
    if (S.view === "events" || S.view === "activity") { if (S.view === "activity") S.filter = { server: "", kind: "" }; reloadEvents(); }
    if (S.view === "accounts") { render(); try { await loadAccounts(); } catch (e) { toast(e.message); } }
    render();
  }));
  const fs = $("#f-server"), fk = $("#f-kind");
  if (fs) fs.onchange = () => { S.filter.server = fs.value; reloadEvents(); };
  if (fk) fk.onchange = () => { S.filter.kind = fk.value; reloadEvents(); };
  const more = $("#more");
  if (more) more.onclick = loadMore;

  const add = $("#f-add");
  if (add) add.onsubmit = async (e) => {
    e.preventDefault();
    try { S.added = await api("/servers", { method: "POST", body: { name: add.name.value } }); S.servers.set(S.added.server.id, S.added.server); add.reset(); }
    catch (err) { toast(err.message); }
    render();
  };
  document.querySelectorAll("[data-server]").forEach((c) => (c.onclick = () => openServer(c.dataset.server)));
  const back = $("[data-back]");
  if (back) back.onclick = () => { S.detail = null; S.hover = null; $("#tip").hidden = true; render(); };
  const ad = $("#added-done");
  if (ad) ad.onclick = () => { S.added = null; render(); };
  document.querySelectorAll("[data-reboot]").forEach((b) => (b.onclick = async () => {
    const s = S.servers.get(b.dataset.reboot);
    if (!s || !confirm(`Reboot ${s.name} now?\n\nThe machine restarts; it is offline for a minute or two.`)) return;
    try { const r = await api(`/servers/${encodeURIComponent(s.id)}/reboot`, { method: "POST", body: {} }); S.servers.set(s.id, r.server); toast(`Reboot sent to ${s.name}`); }
    catch (err) { toast(err.message); }
    render();
  }));

  const nf = $("#f-new");
  if (nf) nf.onsubmit = async (e) => {
    e.preventDefault();
    const servers = [...nf.querySelectorAll("input[name=servers]:checked")].map((x) => x.value);
    try {
      const r = await api("/accounts", { method: "POST", body: { username: nf.username.value, role: nf.role.value, servers, email: nf.email.value, telegram_id: nf.telegram_id.value } });
      S.created = { username: r.account.username, url: r.invite_url };
      nf.reset();
      await loadAccounts();
    } catch (err) { toast(err.message); }
    render();
  };
  const cd = $("#created-done");
  if (cd) cd.onclick = () => { S.created = null; render(); };
  document.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => { S.editing = S.editing === b.dataset.edit ? null : b.dataset.edit; render(); }));
  const ef = $("#f-edit");
  if (ef) {
    const id = ef.dataset.id;
    const a = S.accounts.find((x) => x.id === id);
    ef.onsubmit = async (e) => {
      e.preventDefault();
      const body = { servers: [...ef.querySelectorAll("input[name=servers]:checked")].map((x) => x.value), email: ef.email.value, telegram_id: ef.telegram_id.value };
      if (!ef.role.disabled) body.role = ef.role.value;
      try { await api(`/accounts/${id}`, { method: "PATCH", body }); await loadAccounts(); S.editing = null; toast("Saved"); }
      catch (err) { toast(err.message); }
      render();
    };
    ef.querySelectorAll("[data-act]").forEach((b) => (b.onclick = async () => {
      try {
        if (b.dataset.act === "toggle") await api(`/accounts/${id}`, { method: "PATCH", body: { disabled: !a.disabled } });
        if (b.dataset.act === "reset") {
          if (!confirm(`Reset the login of ${a.username}?\n\nTheir password and second step stop working; they get a new invite link.`)) return;
          const r = await api(`/accounts/${id}/reset`, { method: "POST", body: {} });
          S.created = { username: a.username, url: r.invite_url };
        }
        if (b.dataset.act === "delete") {
          if (!confirm(`Delete the account ${a.username}?`)) return;
          await api(`/accounts/${id}`, { method: "DELETE", body: {} });
          S.editing = null;
        }
        await loadAccounts();
      } catch (err) { toast(err.message); }
      render();
    }));
  }
}

// ---------------------------------------------------------------- start
async function enter() {
  await loadOverview();
  S.view = "events";
  startLive();
  await reloadEvents();
}
async function boot() {
  try { S.config = await api("/config"); } catch { S.config = {}; }
  const link = /^#login=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (link) {
    history.replaceState(null, "", "/"); // the link works once: don't keep it in the address bar
    try { await api("/login/link", { method: "POST", body: { token: link[1] } }); }
    catch (e) { S.login.error = e.message; }
  }
  const m = /^#invite=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (m) {
    S.invite = { token: m[1], info: null, method: null, error: "" };
    render();
    try { S.invite.info = await api(`/invite/${m[1]}`); } catch (e) { S.invite.error = e.message; }
    return render();
  }
  try { await enter(); } catch { S.me = null; render(); }
}
setInterval(() => S.me && (S.view === "events" || S.view === "servers") && renderLater(), 30000); // refresh "x min ago"
boot();
</script>
</body>
</html>
